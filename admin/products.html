<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Products</title>

<link rel="stylesheet" href="/memora-creations/admin/css/style.css?v=5">
</head>

<body>

<nav class="adminnav">
  <div class="container">
    <b>MEMORA ADMIN</b>
    <a href="/memora-creations/admin/dashboard.html">Dashboard</a>
    <a href="/memora-creations/admin/products.html">Products</a>
    <a href="/memora-creations/admin/orders.html">Orders</a>
    <a href="/memora-creations/admin/users.html">Users</a>
  </div>
</nav>

<main class="container adminmain">

  <div class="admin-card">
    <h1>Products</h1>

    <form id="productForm">
      <input type="hidden" id="editId">

      <div class="formgrid">

        <div>
          <label>Name</label>
          <input id="name" class="input" required>
        </div>

        <div>
          <label>Category</label>
          <select id="category" class="select" required></select>
        </div>

        <div class="full">
          <label>Description</label>
          <textarea id="description" class="input" required></textarea>
        </div>

        <div>
          <label>Original Price</label>
          <input id="originalPrice" class="input" type="number" min="0" step="0.01" required>
        </div>

        <div>
          <label>Selling Price</label>
          <input id="sellingPrice" class="input" type="number" min="0" step="0.01" required>
        </div>

        <div>
          <label>Stock</label>
          <input id="stock" class="input" type="number" min="0" required>
        </div>

        <div>
          <label>Keywords comma separated</label>
          <input id="keywords" class="input">
        </div>

        <div class="full">
          <label>Product Images</label>
          <input id="images" type="file" accept="image/*" multiple>
          <div id="preview" class="actions"></div>
        </div>

        <div>
          <label>
            <input id="isFeatured" type="checkbox"> Featured
          </label>
        </div>

        <div>
          <label>
            <input id="isBestSeller" type="checkbox"> Best Seller
          </label>
        </div>

      </div>

      <br>

      <button class="btn">Save Product</button>
      <button type="button" id="cancelEdit" class="btn secondary">Clear</button>
    </form>
  </div>

  <div id="products" class="grid"></div>

  <div class="admin-card">
    <h2>Categories</h2>

    <form id="categoryForm" class="actions">
      <input class="input" id="categoryName" placeholder="Category name" required>
      <button class="btn">Add</button>
    </form>

    <div id="categories" class="actions" style="margin-top:12px"></div>
  </div>

</main>

<script src="/memora-creations/frontend/js/app.js"></script>
<script src="/memora-creations/admin/js/auth.js"></script>
<script src="/memora-creations/admin/js/products.js?v=5"></script>

</body>
</html>

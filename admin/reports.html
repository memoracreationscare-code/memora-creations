<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Memora Admin</title>
  <style>
    body{margin:0;background:#f8f5f0;color:#302117;font-family:Arial,sans-serif}
    .wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
    h1{margin:0 0 6px}.muted{color:#81776f}
    .panel{background:#fff;border:1px solid #e9dfd4;border-radius:16px;padding:18px;margin-top:16px}
    .bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
    label{font-weight:700;font-size:13px;display:block;margin-bottom:5px}
    input[type=date]{padding:10px;border:1px solid #d9c9bd;border-radius:9px;font-size:15px}
    button{padding:11px 18px;border:0;border-radius:9px;background:#805137;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
    button.alt{background:#f1e8df;color:#302117}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
    .card{background:#fff;border:1px solid #eadfd4;border-radius:14px;padding:14px}.card b{display:block;font-size:26px;margin-top:4px}
    table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
    th,td{text-align:left;padding:9px;border-bottom:1px solid #eaded6}th{background:#f5eee8}
    td.n,th.n{text-align:right}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
    .scroll{overflow-x:auto}h2{font-size:18px;margin:0}
  </style>
</head>
<body>
<main class="wrap">
  <h1>Reports</h1>
  <p class="muted">Sale = jo order cancel nahi hua aur COD hai ya online paisa aa chuka hai. Din India time se ginte hain.</p>

  <section class="panel">
    <div class="bar">
      <div><label for="from">Kab se</label><input id="from" type="date"></div>
      <div><label for="to">Kab tak</label><input id="to" type="date"></div>
      <button id="show" type="button">Dikhao</button>
      <button id="month" class="alt" type="button">Is mahine</button>
      <button id="last" class="alt" type="button">Pichla mahina</button>
      <button id="csv" class="alt" type="button">CSV download</button>
    </div>
    <p id="msg" class="muted" aria-live="polite"></p>
  </section>

  <div class="cards" id="cards"></div>

  <section class="panel two">
    <div><h2>Sabse zyada bikne wale products</h2><div class="scroll"><table><thead><tr><th>Product</th><th class="n">Bika</th><th class="n">Rupaye</th></tr></thead><tbody id="products"></tbody></table></div></div>
    <div><h2>Kaunse state se order</h2><div class="scroll"><table><thead><tr><th>State</th><th class="n">Orders</th><th class="n">Rupaye</th></tr></thead><tbody id="states"></tbody></table></div></div>
  </section>
  <section class="panel two">
    <div><h2>Payment ka tarika</h2><div class="scroll"><table><thead><tr><th>Tarika</th><th class="n">Orders</th><th class="n">Rupaye</th></tr></thead><tbody id="payments"></tbody></table></div></div>
    <div><h2>Din ke hisaab se</h2><div class="scroll"><table><thead><tr><th>Date</th><th class="n">Orders</th><th class="n">Rupaye</th></tr></thead><tbody id="days"></tbody></table></div></div>
  </section>
</main>

<script src="/memora-creations/frontend/js/app.js?v=20"></script>
<script src="/memora-creations/admin/js/auth.js?v=16"></script>
<script src="/memora-creations/admin/js/reports.js?v=1"></script>
</body>
</html>

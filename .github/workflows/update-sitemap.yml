name: Update sitemap

# Adds every live product to sitemap.xml so Google can find new products.
# Runs once a day and can be started by hand from the Actions tab.
# It only commits when the sitemap really changed.

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build sitemap
        run: node scripts/build-sitemap.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap unchanged."
          else
            git config user.name "memora-sitemap-bot"
            git config user.email "actions@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Update sitemap with live products"
            git push
          fi

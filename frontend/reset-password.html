<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reset Password - MEMORA CREATIONS</title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css?v=8"
  >
</head>

<body>

  <main class="container">

    <form
      id="resetForm"
      class="form"
    >

      <h1>Reset Password</h1>

      <p class="muted">
        Enter your new password below.
      </p>

      <div class="field">

        <label>
          New Password
        </label>

        <input
          class="input"
          name="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
          placeholder="Minimum 8 characters"
        >

      </div>

      <button
        class="btn"
        type="submit"
      >
        Reset Password
      </button>

      <p>
        <a href="/memora-creations/frontend/login.html">
          Back to Login
        </a>
      </p>

    </form>

  </main>

  <script src="/memora-creations/frontend/js/app.js?v=8"></script>
  <script src="/memora-creations/frontend/js/auth.js?v=8"></script>

</body>
</html>

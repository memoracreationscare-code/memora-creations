<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="48x48" href="/frontend/images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/frontend/images/favicon-192.png">
  <link rel="apple-touch-icon" href="/frontend/images/apple-touch-icon.png">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Reset Password - MEMORA CREATIONS
  </title>

  <link
    rel="stylesheet"
    href="/frontend/css/style.css?v=15"
  >
  <link rel="stylesheet" href="css/loader.css?v=1">
  <script src="js/loader.js?v=1"></script>
  <style>
    body{background:linear-gradient(160deg,#f7efe7,#fffaf5 55%,#f3e6da);min-height:100vh}
    .rp-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
    .rp-card{width:min(440px,100%);background:#fffaf6;border:1px solid #ead9cf;border-radius:26px;padding:30px 26px 26px;box-shadow:0 24px 60px rgba(61,39,23,.12)}
    .rp-icon{width:56px;height:56px;border-radius:50%;background:#f1e2d6;color:#8a5a3b;display:grid;place-items:center;margin-bottom:14px}
    .rp-icon svg{width:26px;height:26px}
    .rp-card h1{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.15;margin:0 0 8px;color:#241c16}
    .rp-card .muted{margin:0 0 18px;color:#6b5d52;line-height:1.6}
    .rp-card label{display:block;font-size:13px;font-weight:800;color:#3a2a20;margin-bottom:8px}
    .rp-pw{position:relative}
    .rp-pw .input{width:100%;box-sizing:border-box;min-height:52px;padding:0 74px 0 16px;border:1.5px solid #e4d2c6;border-radius:14px;background:#fff;font-size:16px}
    .rp-pw .input:focus{outline:none;border-color:#8a5a3b;box-shadow:0 0 0 4px rgba(138,90,59,.14)}
    .rp-show{position:absolute;right:8px;top:8px;height:36px;padding:0 12px;border:0;border-radius:10px;background:#f1e2d6;color:#6f4429;font-weight:800;font-size:13px;cursor:pointer}
    .rp-hint{display:block;margin-top:8px;font-size:12.5px;color:#7d6e62}
    .rp-card .btn{width:100%;min-height:52px;margin-top:18px;border-radius:999px;font-size:16px;font-weight:800;box-shadow:0 12px 26px rgba(113,65,44,.25)}
    .rp-back{display:block;text-align:center;margin-top:18px;color:#8a5a3b;font-weight:800;text-decoration:none}
    .rp-back:hover{text-decoration:underline}
    .rp-note{margin-top:18px;padding:12px 14px;border-radius:12px;background:#fdf1e3;color:#7a4b00;font-size:13px;line-height:1.55}
    .rp-bad{background:#fde8e8;color:#8a1c1c}
  </style>
</head>

<body>
<div class="mc-loader" id="mcLoader" role="status" aria-label="Loading"><div class="mc-loader-mark"><span class="mc-loader-ring"></span><img src="images/logo.png" width="120" height="120" alt="Memora Creations"></div><div class="mc-loader-text">Memora Creations</div></div>

  <main class="rp-wrap">

    <form id="resetForm" class="form rp-card" novalidate>

      <div class="rp-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </div>

      <h1>Naya Password</h1>
      <p class="muted">Apne account ke liye naya password set karein.</p>

      <div id="rpBad" class="rp-note rp-bad" hidden>Ye reset link adhura ya galat hai. Kripya Forgot Password se dobara request karein ya WhatsApp par Memora team se baat karein.</div>

      <label for="rpPass">New Password</label>
      <div class="rp-pw">
        <input id="rpPass" class="input" name="password" type="password" minlength="8" required
               autocomplete="new-password" placeholder="Kam se kam 8 characters">
        <button class="rp-show" type="button" id="rpShow" aria-label="Password dikhao">Show</button>
      </div>
      <small class="rp-hint">Use at least 8 characters. Naam ya mobile number mat rakhiye.</small>

      <button class="btn" type="submit">Password Update Karo</button>

      <a class="rp-back" href="/frontend/login.html">← Back to Login</a>

    </form>

  </main>

  <script>
    (function () {
      var input = document.getElementById('rpPass');
      var btn = document.getElementById('rpShow');
      btn.addEventListener('click', function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
      });
      if (!new URLSearchParams(location.search).get('token')) {
        document.getElementById('rpBad').hidden = false;
      }
    })();
  </script>


  <script
    src="/frontend/js/app.js?v=31"
  ></script>


  <script
    src="/frontend/js/auth.js?v=13"
  ></script>


  <script>

    (async function redirectLoggedInUser() {

      const user =
        await window.MC.currentUser();


      if (!user) {
        return;
      }


      location.href =
        '/frontend/index.html';

    })();

  </script>

  <script src="js/extras.js?v=9" defer></script>
  <script src="js/animations.js?v=1" defer></script>
</body>

</html>

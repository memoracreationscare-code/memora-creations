<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="48x48" href="/memora-creations/frontend/images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/memora-creations/frontend/images/favicon-192.png">
  <link rel="apple-touch-icon" href="/memora-creations/frontend/images/apple-touch-icon.png">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Reset Password - MEMORA CREATIONS
  </title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css?v=14"
  >
  <link rel="stylesheet" href="css/loader.css?v=1">
  <script src="js/loader.js?v=1"></script>
</head>

<body>
<div class="mc-loader" id="mcLoader" role="status" aria-label="Loading"><div class="mc-loader-mark"><span class="mc-loader-ring"></span><img src="images/logo.png" width="120" height="120" alt="Memora Creations"></div><div class="mc-loader-text">Memora Creations</div></div>

  <main class="container">

    <form
      id="resetForm"
      class="form"
    >

      <h1>
        Reset Password
      </h1>

      <p class="muted">
        Enter your new password below.
      </p>


      <div class="field">

        <label>
          New Password
        </label>

        <input
          class="input"
          name="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
          placeholder="Minimum 8 characters"
        >

      </div>


      <button
        class="btn"
        type="submit"
      >
        Reset Password
      </button>


      <p>

        <a
          href="/memora-creations/frontend/login.html"
        >
          Back to Login
        </a>

      </p>

    </form>

  </main>


  <script
    src="/memora-creations/frontend/js/app.js?v=17"
  ></script>


  <script
    src="/memora-creations/frontend/js/auth.js?v=13"
  ></script>


  <script>

    (async function redirectLoggedInUser() {

      const user =
        await window.MC.currentUser();


      if (!user) {
        return;
      }


      location.href =
        '/memora-creations/frontend/index.html';

    })();

  </script>

  <script src="js/extras.js?v=7" defer></script>
  <script src="js/animations.js?v=1" defer></script>
</body>

</html>

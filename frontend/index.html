<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MEMORA CREATIONS</title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css"
  >
</head>

<body>

  <header id="nav" class="topbar"></header>


  <main class="container">

    <!-- HERO -->
    <section class="hero">

      <span class="pill">
        MEMORA CREATIONS
      </span>

      <h1>
        Beautiful things, thoughtfully chosen.
      </h1>

      <p>
        Discover beautiful home decor products
        selected for your space.
      </p>

      <a
        class="btn"
        href="/memora-creations/frontend/products.html"
      >
        Shop Now
      </a>

    </section>


    <!-- CATEGORIES -->
    <section class="section">

      <div class="sectionhead">

        <h2>Categories</h2>

        <a href="/memora-creations/frontend/products.html">
          Shop all
        </a>

      </div>

      <div
        id="categories"
        class="chips"
      ></div>

    </section>


    <!-- ALL PRODUCTS -->
    <section class="section">

      <div class="sectionhead">

        <h2>All Products</h2>

        <a href="/memora-creations/frontend/products.html">
          View all
        </a>

      </div>

      <div
        id="allProducts"
        class="grid"
      ></div>

    </section>

  </main>


  <footer class="footer">
    © MEMORA CREATIONS
  </footer>


  <nav
    id="bottomNav"
    class="bottomnav"
  ></nav>


  <script src="/memora-creations/frontend/js/app.js"></script>


  <script>

    const HOME_BASE = '/memora-creations';


    function homeProductCard(product) {

      return `
        <article class="card">

          <a
            href="${HOME_BASE}/frontend/product.html?id=${encodeURIComponent(product._id)}"
          >

            <img
              class="productimg"
              src="${window.MC.esc(
                product.images?.[0]?.url ||
                'https://placehold.co/600x600?text=Memora'
              )}"
              alt="${window.MC.esc(product.name)}"
            >

            <div class="cardbody">

              <span class="pill">
                ${window.MC.esc(
                  product.category?.name ||
                  'Category'
                )}
              </span>

              <h3>
                ${window.MC.esc(product.name)}
              </h3>

              <div class="price">

                ${window.MC.money(
                  product.sellingPrice
                )}

                ${
                  Number(product.originalPrice) >
                  Number(product.sellingPrice)

                    ? `
                      <span class="old">
                        ${window.MC.money(
                          product.originalPrice
                        )}
                      </span>
                    `

                    : ''
                }

              </div>

              <p class="muted">
                ${
                  product.stock > 0
                    ? 'In stock'
                    : 'Out of stock'
                }
              </p>

            </div>

          </a>


          <div class="cardbody actions">

            <button
              class="btn home-add-cart"
              type="button"
              data-id="${product._id}"
              ${product.stock < 1 ? 'disabled' : ''}
            >
              Add to Cart
            </button>


            <button
              class="btn secondary home-buy-now"
              type="button"
              data-id="${product._id}"
              ${product.stock < 1 ? 'disabled' : ''}
            >
              Buy Now
            </button>

          </div>

        </article>
      `;

    }


    async function addHomeProductToCart(id) {

      try {

        await window.MC.api('/cart', {

          method: 'POST',

          body: JSON.stringify({
            productId: id,
            quantity: 1
          })

        });


        window.MC.toast(
          'Product cart mein add ho gaya.',
          'success'
        );


        window.MC.updateCartCount();


      } catch (error) {

        const msg =
          String(
            error.message || ''
          ).toLowerCase();


        if (
          msg.includes('login') ||
          msg.includes('unauthorized') ||
          msg.includes('authentication')
        ) {

          location.href =
            HOME_BASE +
            '/frontend/login.html?next=' +
            encodeURIComponent(
              location.pathname +
              location.search
            );

          return;

        }


        window.MC.toast(
          error.message ||
          'Cart mein add nahi hua.',
          'error'
        );

      }

    }


    function buyHomeProductNow(id) {

      location.href =
        `${HOME_BASE}/frontend/checkout.html?buyNow=${encodeURIComponent(id)}&qty=1`;

    }


    function bindHomeButtons() {

      document
        .querySelectorAll('.home-add-cart')
        .forEach(button => {

          button.onclick = () => {
            addHomeProductToCart(
              button.dataset.id
            );
          };

        });


      document
        .querySelectorAll('.home-buy-now')
        .forEach(button => {

          button.onclick = () => {
            buyHomeProductNow(
              button.dataset.id
            );
          };

        });

    }


    async function loadHomePage() {

      try {

        const [
          categories,
          products
        ] = await Promise.all([

          window.MC.api(
            '/products/categories'
          ),

          window.MC.api(
            '/products?limit=24'
          )

        ]);


        /* CATEGORIES */

        document
          .getElementById('categories')
          .innerHTML =
            (categories.categories || [])
              .map(category => `

                <a
                  class="pill"
                  href="${HOME_BASE}/frontend/products.html?category=${encodeURIComponent(category._id)}"
                >
                  ${window.MC.esc(
                    category.name
                  )}
                </a>

              `)
              .join('');


        /* ALL PRODUCTS */

        const productList =
          products.products || [];


        document
          .getElementById('allProducts')
          .innerHTML =
            productList.length

              ? productList
                  .map(homeProductCard)
                  .join('')

              : `
                  <div class="empty">
                    No products available yet.
                  </div>
                `;


        bindHomeButtons();


      } catch (error) {

        console.error(
          'Home page error:',
          error
        );


        window.MC.toast(
          error.message ||
          'Home page load failed.',
          'error'
        );

      }

    }


    loadHomePage();

  </script>


</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MEMORA CREATIONS</title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css?v=11"
  >
</head>

<body>

  <header
    id="nav"
    class="topbar"
  ></header>


  <main class="container">

    <!-- HERO -->

    <section class="hero premium-hero">

      <div class="hero-eyebrow">
        MEMORA CREATIONS
      </div>

      <h1>
        Make Your
        <br>
        Space
        <span class="hero-highlight">
          Special.
        </span>
      </h1>

      <p>
        Beautiful home decor and photo frames
        designed to make everyday spaces feel
        more personal.
      </p>

      <a
        class="btn hero-btn"
        href="/memora-creations/frontend/products.html"
      >
        Shop Now
      </a>

    </section>


    <!-- CATEGORIES -->

    <section class="section">

      <div class="sectionhead">

        <h2>
          Categories
        </h2>

        <a
          href="/memora-creations/frontend/products.html"
        >
          Shop all
        </a>

      </div>


      <div
        id="categories"
        class="chips"
      ></div>

    </section>


    <!-- ALL PRODUCTS -->

    <section class="section">

      <div class="sectionhead">

        <h2>
          All Products
        </h2>

        <a
          href="/memora-creations/frontend/products.html"
        >
          View all
        </a>

      </div>


      <div
        id="allProducts"
        class="grid"
      ></div>

    </section>

  </main>


  <footer class="footer">
    © MEMORA CREATIONS
  </footer>


  <nav
    id="bottomNav"
    class="bottomnav"
  ></nav>


  <script
    src="/memora-creations/frontend/js/app.js?v=10"
  ></script>


  <script>

    const HOME_BASE =
      '/memora-creations';

    let homeProducts = [];


    /* =========================
       CLOSE PRODUCT POPUP
    ========================= */

    function closeHomeProductPopup() {

      document
        .querySelector(
          '#homeProductPopup'
        )
        ?.remove();

      document.body.style.overflow =
        '';

    }


    /* =========================
       OPEN PRODUCT POPUP
    ========================= */

    function openHomeProductPopup(
      product
    ) {

      closeHomeProductPopup();

      const overlay =
        document.createElement(
          'div'
        );

      overlay.id =
        'homeProductPopup';

      overlay.className =
        'product-popup-overlay';

      const image =
        product.images?.[0]?.url ||
        'https://placehold.co/600x600?text=Memora';

      overlay.innerHTML = `

        <div class="product-popup">

          <button
            class="product-popup-close"
            type="button"
            aria-label="Close"
          >
            ×
          </button>

          <div
            class="product-popup-imagebox"
          >

            <img
              src="${window.MC.esc(image)}"
              alt="${window.MC.esc(product.name)}"
            >

          </div>

          <div
            class="product-popup-info"
          >

            <span class="pill">

              ${window.MC.esc(
                product.category?.name ||
                'Category'
              )}

            </span>

            <h2>

              ${window.MC.esc(
                product.name || ''
              )}

            </h2>

            <div
              class="product-popup-price"
            >

              ${window.MC.money(
                product.sellingPrice
              )}

              ${
                Number(
                  product.originalPrice
                ) >
                Number(
                  product.sellingPrice
                )

                  ? `
                    <span class="old">

                      ${window.MC.money(
                        product.originalPrice
                      )}

                    </span>
                  `

                  : ''
              }

            </div>

            <p class="muted">

              ${window.MC.esc(
                product.description || ''
              )}

            </p>

            <p>

              ${
                Number(
                  product.stock
                ) > 0

                  ? `✅ In Stock (${Number(product.stock)})`

                  : '❌ Out of Stock'
              }

            </p>

            <div class="field">

              <label>
                Quantity
              </label>

              <input
                class="input home-popup-qty"
                type="number"
                min="1"
                max="${Number(product.stock || 1)}"
                value="1"
                ${
                  Number(product.stock) < 1
                    ? 'disabled'
                    : ''
                }
              >

            </div>

            <div
              class="product-popup-actions"
            >

              <button
                class="btn home-popup-add"
                type="button"
                ${
                  Number(product.stock) < 1
                    ? 'disabled'
                    : ''
                }
              >
                Add to Cart
              </button>

              <button
                class="btn secondary home-popup-order"
                type="button"
                ${
                  Number(product.stock) < 1
                    ? 'disabled'
                    : ''
                }
              >
                Order Now
              </button>

            </div>

          </div>

        </div>

      `;

      document.body.appendChild(
        overlay
      );

      document.body.style.overflow =
        'hidden';

      overlay
        .querySelector(
          '.product-popup-close'
        )
        ?.addEventListener(
          'click',
          closeHomeProductPopup
        );

      overlay.addEventListener(
        'click',
        event => {

          if (
            event.target === overlay
          ) {

            closeHomeProductPopup();

          }

        }
      );

      overlay
        .querySelector(
          '.home-popup-add'
        )
        ?.addEventListener(
          'click',
          async () => {

            const qty =
              Math.max(
                1,
                Number(
                  overlay
                    .querySelector(
                      '.home-popup-qty'
                    )
                    ?.value || 1
                )
              );

            await addHomeProductToCart(
              product._id,
              qty
            );

          }
        );

      overlay
        .querySelector(
          '.home-popup-order'
        )
        ?.addEventListener(
          'click',
          () => {

            const qty =
              Math.max(
                1,
                Number(
                  overlay
                    .querySelector(
                      '.home-popup-qty'
                    )
                    ?.value || 1
                )
              );

            location.href =
              `${HOME_BASE}/frontend/checkout.html?buyNow=${encodeURIComponent(product._id)}&qty=${encodeURIComponent(qty)}`;

          }
        );

    }


    /* =========================
       PRODUCT CARD
    ========================= */

    function homeProductCard(
      product
    ) {

      return `

        <article class="card">

          <button
            class="product-card-open home-product-open"
            type="button"
            data-id="${product._id}"
          >

            <img
              class="productimg"
              src="${window.MC.esc(
                product.images?.[0]?.url ||
                'https://placehold.co/600x600?text=Memora'
              )}"
              alt="${window.MC.esc(product.name)}"
            >

            <div class="cardbody">

              <span class="pill">

                ${window.MC.esc(
                  product.category?.name ||
                  'Category'
                )}

              </span>

              <h3>

                ${window.MC.esc(
                  product.name
                )}

              </h3>

              <div class="price">

                ${window.MC.money(
                  product.sellingPrice
                )}

                ${
                  Number(
                    product.originalPrice
                  ) >
                  Number(
                    product.sellingPrice
                  )

                    ? `
                      <span class="old">

                        ${window.MC.money(
                          product.originalPrice
                        )}

                      </span>
                    `

                    : ''
                }

              </div>

              <p class="muted">

                ${
                  product.stock > 0
                    ? 'In stock'
                    : 'Out of stock'
                }

              </p>

            </div>

          </button>

          <div
            class="cardbody actions"
          >

            <button
              class="btn home-add-cart"
              type="button"
              data-id="${product._id}"
              ${
                product.stock < 1
                  ? 'disabled'
                  : ''
              }
            >
              Add to Cart
            </button>

            <button
              class="btn secondary home-buy-now"
              type="button"
              data-id="${product._id}"
              ${
                product.stock < 1
                  ? 'disabled'
                  : ''
              }
            >
              Order Now
            </button>

          </div>

        </article>

      `;

    }


    /* =========================
       ADD TO CART
    ========================= */

    async function addHomeProductToCart(
      id,
      quantity = 1
    ) {

      try {

        await window.MC.api(
          '/cart',
          {

            method:
              'POST',

            body:
              JSON.stringify({

                productId:
                  id,

                quantity:
                  quantity

              })

          }
        );

        await window.MC.updateCartCount();

        if (
          typeof window.MC.showCartPopup ===
          'function'
        ) {

          window.MC.showCartPopup();

        } else {

          window.MC.toast(
            'Product cart mein add ho gaya.',
            'success'
          );

        }

      } catch (error) {

        const msg =
          String(
            error.message || ''
          ).toLowerCase();

        if (
          msg.includes('login') ||
          msg.includes('unauthorized') ||
          msg.includes('authentication')
        ) {

          location.href =
            HOME_BASE +
            '/frontend/login.html?next=' +
            encodeURIComponent(
              location.pathname +
              location.search
            );

          return;

        }

        window.MC.toast(
          error.message ||
          'Cart mein add nahi hua.',
          'error'
        );

      }

    }


    /* =========================
       ORDER NOW
    ========================= */

    function buyHomeProductNow(
      id
    ) {

      location.href =
        `${HOME_BASE}/frontend/checkout.html?buyNow=${encodeURIComponent(id)}&qty=1`;

    }


    /* =========================
       BIND BUTTONS
    ========================= */

    function bindHomeButtons() {

      document
        .querySelectorAll(
          '.home-product-open'
        )
        .forEach(button => {

          button.onclick =
            () => {

              const product =
                homeProducts.find(
                  item =>
                    item._id ===
                    button.dataset.id
                );

              if (product) {

                openHomeProductPopup(
                  product
                );

              }

            };

        });

      document
        .querySelectorAll(
          '.home-add-cart'
        )
        .forEach(button => {

          button.onclick =
            () => {

              addHomeProductToCart(
                button.dataset.id,
                1
              );

            };

        });

      document
        .querySelectorAll(
          '.home-buy-now'
        )
        .forEach(button => {

          button.onclick =
            () => {

              buyHomeProductNow(
                button.dataset.id
              );

            };

        });

    }


    /* =========================
       LOAD HOME PAGE
    ========================= */

    async function loadHomePage() {

      try {

        const [
          categories,
          products
        ] =
          await Promise.all([

            window.MC.api(
              '/products/categories'
            ),

            window.MC.api(
              '/products?limit=24'
            )

          ]);

        document
          .getElementById(
            'categories'
          )
          .innerHTML =

            (categories.categories || [])
              .map(category => `

                <a
                  class="pill"
                  href="${HOME_BASE}/frontend/products.html?category=${encodeURIComponent(category._id)}"
                >

                  ${window.MC.esc(
                    category.name
                  )}

                </a>

              `)
              .join('');

        homeProducts =
          products.products || [];

        document
          .getElementById(
            'allProducts'
          )
          .innerHTML =

            homeProducts.length

              ? homeProducts
                  .map(
                    homeProductCard
                  )
                  .join('')

              : `
                  <div class="empty">
                    No products available yet.
                  </div>
                `;

        bindHomeButtons();

      } catch (error) {

        console.error(
          'Home page error:',
          error
        );

        window.MC.toast(
          error.message ||
          'Home page load failed.',
          'error'
        );

      }

    }


    /* =========================
       SECURE START
    ========================= */

    (async function startHomePage() {

      const user =
        await window.MC.requireLogin();

      if (!user) {
        return;
      }

      await loadHomePage();

    })();

  </script>


</body>

</html>

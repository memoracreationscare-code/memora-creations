<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Login - MEMORA CREATIONS
  </title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css?v=8"
  >

  <style>

    *{
      box-sizing:border-box
    }

    html,
    body{
      min-height:100%;
    }

    body{
      margin:0;
      background:#f8f0e5;
      color:#28170f;
      overflow-x:hidden;
    }

    .mc-login-page{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      overflow:hidden;
      background:
        linear-gradient(
          135deg,
          #fbf4e9 0%,
          #fff9f1 55%,
          #f9efe0 100%
        );
    }

    .corner-circle{
      position:absolute;
      border-radius:50%;
      pointer-events:none;
    }

    .corner-circle.one{
      width:340px;
      height:340px;
      left:-185px;
      top:-190px;
      background:#5d2d13;
    }

    .corner-circle.two{
      width:430px;
      height:430px;
      right:-255px;
      bottom:-270px;
      border:3px solid rgba(145,87,39,.35);
    }

    .corner-circle.three{
      width:360px;
      height:360px;
      right:-270px;
      bottom:-260px;
      background:#ead7bd;
    }

    .leaf-group{
      position:absolute;
      pointer-events:none;
      opacity:.92;
    }

    .leaf-group.left{
      left:22px;
      bottom:55px;
      width:150px;
      height:185px;
    }

    .leaf-group.right{
      right:22px;
      top:15px;
      width:180px;
      height:180px;
      transform:rotate(20deg);
    }

    .branch{
      position:absolute;
      width:4px;
      height:150px;
      background:#8b542f;
      border-radius:99px;
      left:74px;
      top:15px;
      transform:rotate(32deg);
      transform-origin:bottom;
    }

    .leaf{
      position:absolute;
      width:28px;
      height:60px;
      background:#8b542f;
      border-radius:100% 0 100% 0;
      transform-origin:bottom center;
    }

    .leaf.l1{
      left:38px;
      top:22px;
      transform:rotate(-52deg);
    }

    .leaf.l2{
      left:73px;
      top:2px;
      transform:rotate(-5deg);
    }

    .leaf.l3{
      left:98px;
      top:34px;
      transform:rotate(44deg);
    }

    .leaf.l4{
      left:24px;
      top:74px;
      transform:rotate(-64deg);
    }

    .leaf.l5{
      left:105px;
      top:83px;
      transform:rotate(59deg);
    }

    .login-shell{
      position:relative;
      z-index:5;
      width:min(1090px,94vw);
      min-height:590px;
      display:grid;
      grid-template-columns:380px 1fr;
      background:#fffaf5;
      border:1px solid #ead8c6;
      border-radius:25px;
      overflow:hidden;
      box-shadow:0 28px 70px rgba(73,42,22,.18);
    }

    .login-art{
      position:relative;
      min-height:590px;
      padding:30px 32px;
      overflow:hidden;
      color:white;
      background:
        radial-gradient(
          circle at 85% 12%,
          rgba(255,214,171,.16),
          transparent 32%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(255,203,144,.16),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          #2f1609 0%,
          #5a2b13 42%,
          #7b4222 72%,
          #3e1d0e 100%
        );
    }

    .brand-logo-icon{
      position:relative;
      width:76px;
      height:66px;
      margin:0 auto 8px;
    }

    .logo-frame-one,
    .logo-frame-two{
      position:absolute;
      width:43px;
      height:50px;
      border:4px solid #f4dfc7;
      border-radius:5px;
    }

    .logo-frame-one{
      left:7px;
      top:7px;
    }

    .logo-frame-two{
      left:24px;
      top:0;
    }

    .logo-heart{
      position:absolute;
      right:0;
      bottom:1px;
      font-size:23px;
      color:#f4dfc7;
    }

    .brand-title{
      margin:0;
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
      font-size:52px;
      line-height:.9;
      font-weight:700;
      color:#fff4e7;
      letter-spacing:-2px;
    }

    .brand-divider{
      width:78%;
      height:2px;
      margin:18px auto 12px;
      background:
        linear-gradient(
          90deg,
          transparent,
          #e1a46b 18%,
          #e1a46b 82%,
          transparent
        );
    }

    .brand-subtitle{
      margin:0;
      text-align:center;
      font-size:12px;
      letter-spacing:.26em;
      color:#ead7c3;
      text-transform:uppercase;
    }

    .brand-quote{
      margin:26px auto 0;
      width:82%;
      text-align:center;
      font-family:"Brush Script MT","Segoe Script",cursive;
      font-size:25px;
      line-height:1.15;
      color:#fff0df;
      transform:rotate(-3deg);
    }

    .brand-small-heart{
      display:block;
      margin-top:5px;
      font-size:16px;
      color:#f3c48f;
    }

    .scene{
      position:absolute;
      left:20px;
      right:20px;
      bottom:17px;
      height:250px;
    }

    .scene-table{
      position:absolute;
      left:-20px;
      right:-20px;
      bottom:8px;
      height:18px;
      border-radius:50%;
      background:
        linear-gradient(
          90deg,
          #4d2918,
          #b46f3c 30%,
          #8b4e29 70%,
          #3f2114
        );
      box-shadow:0 10px 20px rgba(0,0,0,.35);
    }

    .scene-frame{
      position:absolute;
      left:120px;
      bottom:35px;
      width:125px;
      height:140px;
      padding:10px;
      border-radius:4px;
      background:
        linear-gradient(
          135deg,
          #6b351a,
          #bd7745,
          #5b2d17
        );
      box-shadow:0 16px 25px rgba(0,0,0,.3);
      transform:rotate(-2deg);
    }

    .scene-photo{
      width:100%;
      height:100%;
      background:
        radial-gradient(
          circle at 50% 35%,
          #ffd694 0 9%,
          transparent 10%
        ),
        linear-gradient(
          180deg,
          #d78f54 0%,
          #82523a 40%,
          #49382d 62%,
          #291e19 100%
        );
    }

    .scene-mug{
      position:absolute;
      right:25px;
      bottom:30px;
      width:83px;
      height:105px;
      border-radius:8px 8px 22px 22px;
      background:#eee3d2;
      box-shadow:0 14px 25px rgba(0,0,0,.27);
      color:#4d2816;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-family:Georgia,serif;
      font-size:13px;
      font-style:italic;
      line-height:1.1;
    }

    .scene-mug::after{
      content:"";
      position:absolute;
      right:-27px;
      top:27px;
      width:30px;
      height:43px;
      border:7px solid #eee3d2;
      border-left:0;
      border-radius:0 25px 25px 0;
    }

    .plant-pot{
      position:absolute;
      left:35px;
      bottom:28px;
      width:66px;
      height:72px;
      border-radius:8px 8px 18px 18px;
      background:
        linear-gradient(
          135deg,
          #d3b08d,
          #795035
        );
      box-shadow:0 12px 22px rgba(0,0,0,.25);
    }

    .plant-leaf{
      position:absolute;
      left:62px;
      bottom:88px;
      width:30px;
      height:85px;
      border-radius:100% 0 100% 0;
      background:
        linear-gradient(
          180deg,
          #748935,
          #324719
        );
      transform-origin:bottom;
    }

    .plant-leaf.a{
      transform:rotate(-48deg);
    }

    .plant-leaf.b{
      transform:rotate(-14deg);
      height:95px;
    }

    .plant-leaf.c{
      transform:rotate(26deg);
      height:90px;
    }

    .plant-leaf.d{
      transform:rotate(56deg);
      height:75px;
    }

    .login-side{
      padding:50px 62px 35px;
      display:flex;
      align-items:center;
      background:rgba(255,250,245,.98);
    }

    .login-content{
      width:100%;
      max-width:560px;
      margin:auto;
    }

    .welcome-row{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .welcome-icon{
      width:58px;
      height:58px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f2dfca;
      color:#7b3f20;
    }

    .welcome-title{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(42px,5vw,58px);
      line-height:1;
      letter-spacing:-1.8px;
      color:#30180d;
    }

    .login-intro{
      margin:16px 0 0 73px;
      color:#82776f;
      font-size:17px;
      line-height:1.35;
    }

    .login-intro strong{
      display:block;
      margin-top:2px;
      color:#30221a;
      font-size:18px;
    }

    .title-underline{
      width:62px;
      height:4px;
      margin:16px 0 26px 73px;
      border-radius:10px;
      background:#c48148;
    }

    .login-field{
      margin-bottom:18px;
    }

    .input-shell{
      position:relative;
    }

    .login-input{
      width:100%;
      height:66px;
      padding:0 58px 0 60px;
      border:1px solid #dfcfc0;
      border-radius:20px;
      outline:0;
      background:#fffdfa;
      color:#2c2019;
      font:inherit;
      font-size:16px;
    }

    .login-input:focus{
      border-color:#a76539;
      box-shadow:0 0 0 4px rgba(167,101,57,.10);
    }

    .input-icon{
      position:absolute;
      left:20px;
      top:50%;
      transform:translateY(-50%);
      color:#8e5030;
    }

    .input-icon svg{
      width:22px;
      height:22px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.8;
    }

    .password-toggle{
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      width:38px;
      height:38px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:#8e5030;
      cursor:pointer;
    }

    .main-login-btn{
      width:100%;
      height:61px;
      margin-top:6px;
      border:0;
      border-radius:17px;
      cursor:pointer;
      background:
        linear-gradient(
          180deg,
          #a86336,
          #864521
        );
      color:white;
      font-size:18px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:15px;
      box-shadow:0 10px 20px rgba(111,57,29,.18);
    }

    .main-login-btn:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .login-arrow{
      font-size:28px;
    }

    .login-links{
      margin-top:24px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .login-links a{
      color:#39261c;
      font-weight:600;
      font-size:15px;
    }

    .security-row{
      margin-top:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:13px;
      color:#92542f;
      font-size:11px;
      letter-spacing:.27em;
      font-weight:700;
      text-transform:uppercase;
    }

    @media(max-width:900px){

      .login-shell{
        grid-template-columns:1fr;
        width:min(600px,96vw);
      }

      .login-art{
        min-height:300px;
      }

      .scene{
        display:none;
      }

      .login-side{
        padding:34px 26px 32px;
      }

    }

    @media(max-width:600px){

      .login-art{
        display:none;
      }

      .login-side{
        padding:34px 20px 28px;
      }

      .welcome-title{
        font-size:38px;
      }

      .login-intro,
      .title-underline{
        margin-left:0;
      }

      .login-input{
        height:60px;
      }

    }

  </style>
</head>


<body>

  <main class="mc-login-page">

    <div class="corner-circle one"></div>
    <div class="corner-circle two"></div>
    <div class="corner-circle three"></div>

    <div class="leaf-group left">
      <span class="branch"></span>
      <span class="leaf l1"></span>
      <span class="leaf l2"></span>
      <span class="leaf l3"></span>
      <span class="leaf l4"></span>
      <span class="leaf l5"></span>
    </div>

    <section class="login-shell">

      <aside class="login-art">

        <div class="brand-logo-icon">
          <span class="logo-frame-one"></span>
          <span class="logo-frame-two"></span>
          <span class="logo-heart">♥</span>
        </div>

        <h2 class="brand-title">
          Memora
        </h2>

        <div class="brand-divider"></div>

        <p class="brand-subtitle">
          Creations
        </p>

        <p
          class="brand-subtitle"
          style="margin-top:9px;font-size:10px"
        >
          Photo Frames • Gifts • More
        </p>

        <div class="brand-quote">
          Capture Moments,
          <br>
          Create Memories
          <span class="brand-small-heart">♥</span>
        </div>

        <div class="scene">

          <span class="plant-leaf a"></span>
          <span class="plant-leaf b"></span>
          <span class="plant-leaf c"></span>
          <span class="plant-leaf d"></span>

          <div class="plant-pot"></div>

          <div class="scene-frame">
            <div class="scene-photo"></div>
          </div>

          <div class="scene-mug">
            Good
            <br>
            Vibes
            <br>
            Only ♥
          </div>

          <div class="scene-table"></div>

        </div>

      </aside>


      <section class="login-side">

        <div class="login-content">

          <div class="welcome-row">

            <div class="welcome-icon">
              👤
            </div>

            <h1 class="welcome-title">
              Welcome Back
            </h1>

          </div>

          <p class="login-intro">
            Login to continue your journey with
            <strong>
              Memora Creations
            </strong>
          </p>

          <div class="title-underline"></div>


          <form id="loginForm">

            <div class="login-field">

              <div class="input-shell">

                <span class="input-icon">
                  <svg viewBox="0 0 24 24">
                    <rect
                      x="7"
                      y="2"
                      width="10"
                      height="20"
                      rx="2"
                    ></rect>

                    <path
                      d="M10 18h4"
                    ></path>
                  </svg>
                </span>

                <input
                  class="login-input"
                  name="mobile"
                  type="tel"
                  placeholder="Mobile Number"
                  required
                  inputmode="numeric"
                  pattern="[6-9][0-9]{9}"
                  maxlength="10"
                  autocomplete="tel"
                >

              </div>

            </div>


            <div class="login-field">

              <div class="input-shell">

                <span class="input-icon">
                  🔒
                </span>

                <input
                  class="login-input"
                  id="loginPassword"
                  name="password"
                  type="password"
                  placeholder="Password"
                  required
                  autocomplete="current-password"
                >

                <button
                  class="password-toggle"
                  id="togglePassword"
                  type="button"
                  aria-label="Show password"
                >
                  👁
                </button>

              </div>

            </div>


            <button
              class="main-login-btn"
              type="submit"
            >
              <span>
                Login
              </span>

              <span class="login-arrow">
                →
              </span>
            </button>


            <div class="login-links">

              <a
                href="/memora-creations/frontend/signup.html"
              >
                Create account
              </a>

              <a
                href="/memora-creations/frontend/forgot-password.html"
              >
                Forgot password?
              </a>

            </div>


            <div class="security-row">

              <span>
                🔒
              </span>

              <span>
                Safe
              </span>

              <span>
                •
              </span>

              <span>
                Secure
              </span>

              <span>
                •
              </span>

              <span>
                Always
              </span>

            </div>

          </form>

        </div>

      </section>

    </section>

  </main>


  <script
    src="/memora-creations/frontend/js/app.js?v=8"
  ></script>

  <script
    src="/memora-creations/frontend/js/auth.js?v=8"
  ></script>


  <script>

    const passwordInput =
      document.getElementById(
        'loginPassword'
      );

    const passwordToggle =
      document.getElementById(
        'togglePassword'
      );

    if (
      passwordInput &&
      passwordToggle
    ) {

      passwordToggle
        .addEventListener(
          'click',
          () => {

            const hidden =
              passwordInput.type ===
              'password';

            passwordInput.type =
              hidden
                ? 'text'
                : 'password';

          }
        );

    }

  </script>

</body>

</html>

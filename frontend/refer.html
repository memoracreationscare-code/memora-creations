  <style>
    .rf-wrap{max-width:860px;margin:auto;padding:36px 16px 110px;min-height:65vh}
    .rf-top{text-align:center;margin-bottom:22px}
    .rf-top span{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#92664e}
    .rf-top h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,46px);margin:10px 0;color:#302117}
    .rf-top a{color:#845237;font-weight:700;text-decoration:none;font-size:14px}
    .rf-card{background:#fff;border:1px solid #e9dfd7;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #3e29100d}
    .rf-card h3{margin:0 0 10px;font-family:Georgia,serif;font-size:21px;color:#302117}
    .rf-hero{background:linear-gradient(135deg,#fff8ea,#fbe6c7);border-color:#e7cfa4;text-align:center}
    .rf-hero h2{font-family:Georgia,serif;font-size:clamp(22px,4vw,30px);margin:6px 0;color:#3a2618}
    .rf-hero p{color:#6d5a49;margin:6px auto 14px;max-width:520px}
    .rf-eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#92664e;font-weight:800}
    .rf-code{display:inline-grid;gap:2px;background:#fff;border:2px dashed #b98a2c;border-radius:14px;padding:10px 26px;margin-bottom:14px}
    .rf-code span{font-size:12px;color:#8a7360}.rf-code b{font-size:30px;letter-spacing:5px;color:#7a4a30}
    .rf-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .rf-btn{border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit}
    .rf-wa{background:#25d366;color:#fff}.rf-line{background:#fff;color:#5b3a24;border:1px solid #c9a066}
    .rf-mini{margin-left:6px;padding:3px 11px;border-radius:8px;border:1px solid #b98a2c;background:#fff;color:#5b3a24;font-weight:700;cursor:pointer;font-size:13px}
    .rf-steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;color:#4b3a2e;line-height:1.55}
    .rf-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
    .rf-tile{background:#fffaf3;border:1px solid #ecdcc8;border-radius:13px;padding:11px 6px;text-align:center}
    .rf-tile b{display:block;font-size:22px;color:#7a4a30}.rf-tile span{font-size:12px;color:#7a6a5d}
    .rf-note,.rf-offer{padding:12px 14px;margin-top:10px;border-radius:12px;background:#fff8ea;border:1px dashed #b98a2c;font-size:14.5px;line-height:1.55}
    .rf-row{padding:11px 0;border-top:1px solid #f0e4d4}
    .rf-row-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
    .rf-row small{color:#8a7b6e}.rf-sub{margin-top:5px;font-size:13.5px}
    .rf-chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
    .rf-empty{color:#8a7b6e;font-size:14px}.rf-fine{font-size:12px;color:#8a7b6e;margin:10px 0 0}
    @media(max-width:560px){.rf-tiles{grid-template-columns:repeat(2,1fr)}.rf-code b{font-size:24px}}
  </style>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="/frontend/css/style.css"></head><body><header id="nav" class="topbar"></header><main id="checkout" class="container section"><div class="two"><form id="checkoutForm" class="form" style="margin:0"><h1>Checkout</h1><div class="field"><label>Full Name *</label><input id="fullName" class="input" required></div><div class="field"><label>Mobile *</label><input id="mobile" class="input" required></div><div class="field"><label>Address *</label><textarea id="addressLine" class="input" required></textarea></div><div class="field"><label>PIN Code *</label><input id="pinCode" class="input" required pattern="[0-9]{6}"></div><div class="field"><label>City</label><input id="city" class="input"></div><div class="field"><label>State</label><input id="state" class="input"></div><div class="field"><label><input type="radio" name="paymentMethod" value="COD" checked> Cash on Delivery</label><label><input type="radio" name="paymentMethod" value="RAZORPAY"> Pay Online (Razorpay)</label></div><div class="field"><label><input id="terms" type="checkbox"> I confirm the order details.</label></div><button class="btn">Place Order / Pay</button></form><aside id="summary" class="summary"></aside></div></main><script src="/frontend/js/app.js"></script><script src="/frontend/js/checkout.js"></script></body></html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Checkout - MEMORA CREATIONS</title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css"
  >
</head>

<body>

  <header id="nav" class="topbar"></header>

  <main
    id="checkout"
    class="container section"
  >

    <div class="two">

      <form
        id="checkoutForm"
        class="form"
        style="margin:0"
      >

        <h1>Checkout</h1>

        <div class="field">
          <label>Full Name *</label>
          <input
            id="fullName"
            class="input"
            required
          >
        </div>

        <div class="field">
          <label>Mobile *</label>
          <input
            id="mobile"
            class="input"
            required
            inputmode="numeric"
            maxlength="10"
          >
        </div>

        <div class="field">
          <label>Address *</label>
          <textarea
            id="addressLine"
            class="input"
            required
          ></textarea>
        </div>

        <div class="field">
          <label>PIN Code *</label>
          <input
            id="pinCode"
            class="input"
            required
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
          >
        </div>

        <div class="field">
          <label>City</label>
          <input
            id="city"
            class="input"
          >
        </div>

        <div class="field">
          <label>State</label>
          <input
            id="state"
            class="input"
          >
        </div>

        <div class="field">

          <label>
            <input
              type="radio"
              name="paymentMethod"
              value="COD"
              checked
            >
            Cash on Delivery
          </label>

          <br><br>

          <label>
            <input
              type="radio"
              name="paymentMethod"
              value="RAZORPAY"
            >
            Pay Online (Razorpay)
          </label>

        </div>

        <div class="field">

          <label>
            <input
              id="terms"
              type="checkbox"
            >
            I confirm the order details.
          </label>

        </div>

        <button
          class="btn"
          type="submit"
        >
          Place Order / Pay
        </button>

      </form>


      <aside
        id="summary"
        class="summary"
      ></aside>

    </div>

  </main>


  <nav
    id="bottomNav"
    class="bottomnav"
  ></nav>


  <script src="/memora-creations/frontend/js/app.js"></script>
  <script src="/memora-creations/frontend/js/checkout.js"></script>

</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Forgot Password - MEMORA CREATIONS
  </title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css?v=9"
  >
</head>

<body>

  <main class="container">

    <form
      id="forgotForm"
      class="form"
    >

      <h1>
        Forgot Password
      </h1>

      <p class="muted">
        Enter your registered mobile number.
      </p>


      <div class="field">

        <label>
          Registered Mobile Number
        </label>

        <input
          class="input"
          name="mobile"
          type="tel"
          required
          inputmode="numeric"
          pattern="[6-9][0-9]{9}"
          maxlength="10"
          autocomplete="tel"
          placeholder="Enter 10-digit mobile number"
        >

      </div>


      <button
        class="btn"
        type="submit"
      >
        Send Reset Link
      </button>


      <p>

        <a
          href="/memora-creations/frontend/login.html"
        >
          Back to Login
        </a>

      </p>

    </form>

  </main>


  <script
    src="/memora-creations/frontend/js/app.js?v=9"
  ></script>


  <script
    src="/memora-creations/frontend/js/auth.js?v=9"
  ></script>


  <script>

    (async function redirectLoggedInUser() {

      const user =
        await window.MC.currentUser();


      if (!user) {
        return;
      }


      location.href =
        '/memora-creations/frontend/index.html';

    })();

  </script>

</body>

</html>

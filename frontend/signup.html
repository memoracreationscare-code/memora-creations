<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Create Account - MEMORA CREATIONS</title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css"
  >
</head>

<body>

  <main class="container">

    <form id="signupForm" class="form">

      <h1>Create Account</h1>

      <div class="field">
        <label>Full Name *</label>
        <input
          class="input"
          name="fullName"
          required
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label>Mobile Number *</label>
        <input
          class="input"
          name="mobile"
          required
          inputmode="numeric"
          pattern="[6-9][0-9]{9}"
          maxlength="10"
          autocomplete="tel"
        >
      </div>

      <div class="field">
        <label>Email</label>
        <input
          class="input"
          name="email"
          type="email"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>Password *</label>
        <input
          class="input"
          name="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="field">
        <label>Address *</label>
        <textarea
          class="input"
          name="addressLine"
          required
          autocomplete="street-address"
        ></textarea>
      </div>

      <div class="field">
        <label>PIN Code *</label>
        <input
          class="input"
          name="pinCode"
          required
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          autocomplete="postal-code"
        >
      </div>

      <div class="field">
        <label>City</label>
        <input
          class="input"
          name="city"
          autocomplete="address-level2"
        >
      </div>

      <div class="field">
        <label>State</label>
        <input
          class="input"
          name="state"
          autocomplete="address-level1"
        >
      </div>

      <button
        class="btn"
        type="submit"
      >
        Create Account
      </button>

      <p>
        <a href="/memora-creations/frontend/login.html">
          Already have an account?
        </a>
      </p>

    </form>

  </main>

  <script src="/memora-creations/frontend/js/app.js"></script>
  <script src="/memora-creations/frontend/js/auth.js"></script>

</body>
</html>

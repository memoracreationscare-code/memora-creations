<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Track Your Order | MEMORA CREATIONS</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/frontend/images/favicon-48.png">
  <link rel="stylesheet" href="/frontend/css/style.css?v=14">
  <style>
    .trk{max-width:560px;margin:28px auto 90px;padding:0 16px}
    .trk-card{background:#fff;border:1px solid #eadfce;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(60,40,20,.07)}
    .trk h1{margin:0 0 6px;font-size:24px}
    .trk p.lead{margin:0 0 18px;color:#7a6a58;font-size:14px}
    .trk label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
    .trk input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9c9b4;border-radius:12px;font-size:16px}
    .trk button.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#8a5a3b;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
    .trk button.go[disabled]{opacity:.6}
    .trk-err{margin-top:14px;color:#b3261e;font-weight:600;font-size:14px}
    .trk-res{margin-top:20px}
    .trk-badge{display:inline-block;padding:5px 12px;border-radius:999px;background:#e8f6ee;color:#1f7a4a;font-weight:800;font-size:13px}
    .trk-badge.bad{background:#fdeceb;color:#b3261e}
    .trk-steps{list-style:none;margin:18px 0 0;padding:0;position:relative}
    .trk-steps li{position:relative;padding:0 0 18px 30px;font-size:14px}
    .trk-steps li::before{content:"";position:absolute;left:6px;top:14px;bottom:-4px;width:2px;background:#e4d8c6}
    .trk-steps li:last-child::before{display:none}
    .trk-steps li i{position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;background:#d9c9b4;border:3px solid #fff;box-shadow:0 0 0 2px #d9c9b4}
    .trk-steps li.done i{background:#2f8f5b;box-shadow:0 0 0 2px #2f8f5b}
    .trk-steps li b{display:block}
    .trk-steps li small{color:#8a7a68}
    .trk-ship{margin-top:6px;padding:14px;border-radius:14px;background:#fffaf3;border:1px solid #eadfce;font-size:14px;line-height:1.6}
    .trk-ship a{color:#8a5a3b;font-weight:800}
    .trk-items{margin:14px 0 0;font-size:13.5px;color:#5a4a3a}
    .trk-links{text-align:center;margin-top:18px;font-size:14px}
  </style>
</head>
<body>
  <main class="trk">
    <div class="trk-card">
      <h1>📦 Track Your Order</h1>
      <p class="lead">Login ki zaroorat nahi. Order number aur checkout wala mobile number daalein.</p>

      <form id="trkForm" novalidate>
        <label for="trkId">Order number</label>
        <input id="trkId" autocomplete="off" autocapitalize="characters" placeholder="e.g. MC123456">
        <label for="trkMobile">Mobile number</label>
        <input id="trkMobile" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile">
        <button class="go" type="submit">Track Order</button>
      </form>
      <div class="trk-err" id="trkErr" role="alert"></div>
      <div class="trk-res" id="trkRes" aria-live="polite"></div>
    </div>
    <div class="trk-links">
      <a href="/frontend/index.html">← Home</a> ·
      <a href="/frontend/orders.html">My Orders</a> ·
      <a href="/frontend/contact.html">Madad chahiye?</a>
    </div>
  </main>

  <script src="/frontend/js/track-order.js?v=2"></script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Profile - MEMORA CREATIONS
  </title>

  <link
    rel="stylesheet"
    href="/memora-creations/frontend/css/style.css?v=11"
  >
</head>

<body>

  <header
    id="nav"
    class="topbar"
  ></header>


  <main
    class="container section"
  >

    <div class="two">


      <!-- PROFILE FORM -->

      <form
        id="profileForm"
        class="form"
        style="margin:0;"
      >

        <h1>
          My Profile
        </h1>


        <div class="field">

          <label>
            Full Name
          </label>

          <input
            id="fullName"
            class="input"
            required
          >

        </div>


        <div class="field">

          <label>
            Mobile Number
          </label>

          <input
            id="mobile"
            class="input"
            disabled
          >

        </div>


        <div class="field">

          <label>
            Email
          </label>

          <input
            id="email"
            class="input"
            type="email"
          >

        </div>


        <button
          class="btn"
          type="submit"
          style="width:100%;"
        >
          Save Profile
        </button>


        <button
          id="profileLogoutBtn"
          class="btn danger"
          type="button"
          style="
            width:100%;
            margin-top:14px;
          "
        >
          Logout
        </button>

      </form>


      <!-- RIGHT SIDE -->

      <div>


        <!-- CUSTOMER CARE -->

        <section
          style="
            margin-bottom:24px;
          "
        >

          <div
            class="card"
            style="
              border-radius:20px;
              overflow:hidden;
            "
          >

            <div
              class="cardbody"
              style="
                padding:22px;
              "
            >

              <div
                style="
                  font-size:12px;
                  font-weight:800;
                  letter-spacing:.16em;
                  color:#9b613c;
                  margin-bottom:7px;
                "
              >
                NEED HELP?
              </div>


              <h2
                style="
                  margin:0 0 8px;
                "
              >
                Customer Care
              </h2>


              <p
                class="muted"
                style="
                  margin:0 0 18px;
                  line-height:1.6;
                "
              >
                Order, payment, delivery ya account se related help ke liye humse contact karein.
              </p>


              <!-- WHATSAPP -->

              <a
                href="https://wa.me/917054242294?text=Namaste%20Memora%20Creations%2C%20mujhe%20help%20chahiye."
                target="_blank"
                rel="noopener noreferrer"
                style="
                  display:flex;
                  align-items:center;
                  gap:14px;
                  padding:15px;
                  border:1px solid #e7e0d8;
                  border-radius:16px;
                  text-decoration:none;
                  color:inherit;
                  margin-bottom:12px;
                  background:#fff;
                "
              >

                <div
                  style="
                    width:48px;
                    height:48px;
                    border-radius:14px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#eaf8ef;
                    flex-shrink:0;
                  "
                >

                  <svg
                    viewBox="0 0 24 24"
                    width="25"
                    height="25"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="color:#1f9d55;"
                  >
                    <path
                      d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8z"
                    ></path>
                  </svg>

                </div>


                <div
                  style="
                    flex:1;
                    min-width:0;
                  "
                >

                  <div
                    style="
                      font-weight:800;
                      margin-bottom:3px;
                    "
                  >
                    WhatsApp Support
                  </div>

                  <div
                    class="muted"
                    style="
                      font-size:14px;
                    "
                  >
                    +91 70542 42294
                  </div>

                </div>


                <div
                  style="
                    font-size:22px;
                  "
                >
                  ›
                </div>

              </a>


              <!-- EMAIL -->

              <a
                href="mailto:memoracreations.care@gmail.com?subject=Memora%20Creations%20Customer%20Support"
                style="
                  display:flex;
                  align-items:center;
                  gap:14px;
                  padding:15px;
                  border:1px solid #e7e0d8;
                  border-radius:16px;
                  text-decoration:none;
                  color:inherit;
                  background:#fff;
                "
              >

                <div
                  style="
                    width:48px;
                    height:48px;
                    border-radius:14px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#f5eee7;
                    flex-shrink:0;
                  "
                >

                  <svg
                    viewBox="0 0 24 24"
                    width="25"
                    height="25"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="color:#8a5a3b;"
                  >
                    <rect
                      x="3"
                      y="5"
                      width="18"
                      height="14"
                      rx="2"
                    ></rect>

                    <path
                      d="M3 7l9 6 9-6"
                    ></path>
                  </svg>

                </div>


                <div
                  style="
                    flex:1;
                    min-width:0;
                  "
                >

                  <div
                    style="
                      font-weight:800;
                      margin-bottom:3px;
                    "
                  >
                    Email Support
                  </div>

                  <div
                    class="muted"
                    style="
                      font-size:14px;
                      word-break:break-word;
                    "
                  >
                    memoracreations.care@gmail.com
                  </div>

                </div>


                <div
                  style="
                    font-size:22px;
                  "
                >
                  ›
                </div>

              </a>

            </div>

          </div>

        </section>


        <!-- ADDRESS SECTION -->

        <h2>
          Saved Addresses
        </h2>


        <div
          id="addresses"
        ></div>


        <form
          id="addressForm"
          class="form"
          style="margin:16px 0;"
        >

          <h3>
            Add New Address
          </h3>


          <div class="field">

            <label>
              Label
            </label>

            <input
              class="input"
              name="label"
              placeholder="Home / Work"
            >

          </div>


          <div class="field">

            <label>
              Full Name
            </label>

            <input
              class="input"
              name="fullName"
              required
            >

          </div>


          <div class="field">

            <label>
              Mobile
            </label>

            <input
              class="input"
              name="mobile"
              type="tel"
              required
              inputmode="numeric"
              pattern="[6-9][0-9]{9}"
              maxlength="10"
              autocomplete="tel"
            >

          </div>


          <div class="field">

            <label>
              Address
            </label>

            <textarea
              class="input"
              name="addressLine"
              required
            ></textarea>

          </div>


          <div class="field">

            <label>
              PIN Code
            </label>

            <input
              class="input"
              name="pinCode"
              required
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
            >

          </div>


          <div class="field">

            <label>
              City
            </label>

            <input
              class="input"
              name="city"
            >

          </div>


          <div class="field">

            <label>
              State
            </label>

            <input
              class="input"
              name="state"
            >

          </div>


          <div class="field">

            <label>

              <input
                id="isDefault"
                type="checkbox"
                name="isDefault"
              >

              Make default address

            </label>

          </div>


          <button
            class="btn"
            type="submit"
          >
            Save Address
          </button>

        </form>

      </div>

    </div>

  </main>


  <nav
    id="bottomNav"
    class="bottomnav"
  ></nav>


  <script
    src="/memora-creations/frontend/js/app.js?v=10"
  ></script>


  <script>

    (async function secureProfilePage() {

      const user =
        await window.MC.requireLogin();


      if (!user) {
        return;
      }


      const script =
        document.createElement(
          'script'
        );


      script.src =
        '/memora-creations/frontend/js/profile.js?v=9';


      document.body.appendChild(
        script
      );


      const logoutButton =
        document.getElementById(
          'profileLogoutBtn'
        );


      if (logoutButton) {

        logoutButton.addEventListener(
          'click',
          async () => {

            const confirmLogout =
              confirm(
                'Kya aap logout karna chahte hain?'
              );


            if (!confirmLogout) {
              return;
            }


            await window.MC.logoutUser();

          }
        );

      }

    })();

  </script>

</body>

</html>

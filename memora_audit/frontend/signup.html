<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up</title><link rel="stylesheet" href="/frontend/css/style.css"></head><body><main class="container"><form id="signupForm" class="form"><h1>Create Account</h1><div class="field"><label>Full Name *</label><input class="input" name="fullName" required></div><div class="field"><label>Mobile Number *</label><input class="input" name="mobile" required pattern="[6-9][0-9]{9}"></div><div class="field"><label>Email</label><input class="input" name="email" type="email"></div><div class="field"><label>Password *</label><input class="input" name="password" type="password" minlength="8" required></div><div class="field"><label>Address *</label><textarea class="input" name="addressLine" required></textarea></div><div class="field"><label>PIN Code *</label><input class="input" name="pinCode" required pattern="[0-9]{6}"></div><div class="field"><label>City</label><input class="input" name="city"></div><div class="field"><label>State</label><input class="input" name="state"></div><button class="btn">Create Account</button><p><a href="/frontend/login.html">Already have an account?</a></p></form></main><script src="/frontend/js/app.js"></script><script src="/frontend/js/auth.js"></script></body></html>
